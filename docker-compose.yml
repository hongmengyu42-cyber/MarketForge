version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: marketforge-mysql
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb_buffer_pool_size=256M
      --max_connections=200
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secure_password_2026}
      MYSQL_DATABASE: ${DB_NAME:-marketforge}
      MYSQL_USER: ${DB_USERNAME:-marketforge}
      MYSQL_PASSWORD: ${DB_PASSWORD:-marketforge_secure_pw_2026}
    ports:
      - "${HOST_DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - marketforge-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: marketforge-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-marketforge}
      DB_USERNAME: ${DB_USERNAME:-marketforge}
      DB_PASSWORD: ${DB_PASSWORD:-marketforge_secure_pw_2026}
      JWT_SECRET: ${JWT_SECRET:-marketforge-production-high-entropy-jwt-secret-key-2026}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:80,https://marketforge.dev}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
      MAIL_HOST: ${MAIL_HOST:-smtp.mailtrap.io}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      UPLOAD_DIR: /app/uploads
      BASE_URL: ${BASE_URL:-http://localhost:8080}
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - marketforge-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: marketforge-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - uploads_data:/usr/share/nginx/html/uploads:ro
    networks:
      - marketforge-network

volumes:
  mysql_data:
    name: marketforge_mysql_data
  uploads_data:
    name: marketforge_uploads_data

networks:
  marketforge-network:
    name: marketforge-network
    driver: bridge
