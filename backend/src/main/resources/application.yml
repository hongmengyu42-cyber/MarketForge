spring:
  application:
    name: marketforge-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/marketforge?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 20
    open-in-view: true

  jackson:
    serialization:
      fail-on-empty-beans: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 30MB

  mail:
    host: ${MAIL_HOST:smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    context-path: /

# CORS — comma-separated list of allowed frontend origins
app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:marketforge-super-secret-key-please-change-in-production-2026}
  expiration-ms: 86400000   # 24 hours
  refresh-expiration-ms: 604800000  # 7 days

# Stripe Configuration
stripe:
  api-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
  platform-fee-percent: 10

# Google OAuth
google:
  client-id: ${GOOGLE_CLIENT_ID:811314370925-8a6ft9l13fde6q6vooddsvfihadi6csg.apps.googleusercontent.com}

# File Upload
storage:
  upload-dir: ${UPLOAD_DIR:./uploads}
  base-url: ${BASE_URL:http://localhost:8080}


# SpringDoc / Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# Logging

logging:
  level:
    com.marketforge: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
