spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:4000}/${DB_NAME:marketforge}?createDatabaseIfNotExist=true&sslMode=VERIFY_IDENTITY&serverTimezone=UTC&allowPublicKeyRetrieval=true&enabledTLSProtocols=TLSv1.2,TLSv1.3&nullCatalogMeansCurrent=true}}
    username: ${DB_USERNAME:marketforge}
    password: ${DB_PASSWORD:marketforge_secure_prod_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: MarketForgeHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1200000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 30
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true
        hbm2ddl:
          extra_physical_table_types: ""
    open-in-view: false

  mail:
    host: ${MAIL_HOST:smtp.sendgrid.net}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:https://marketforge.dev,https://www.marketforge.dev}
  frontend-url: ${FRONTEND_URL:https://marketforge.dev}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: WARN
    com.marketforge: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.hibernate: WARN
